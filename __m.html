<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head>
<body style="margin:0;background:#222">
<iframe id="f" src="index.html" style="width:390px;height:1500px;border:0;display:block"></iframe>
<script>
  var f=document.getElementById('f');
  f.addEventListener('load',function(){setTimeout(function(){
    try{var d=f.contentDocument,de=d.documentElement;
      document.title='SW='+de.scrollWidth+' IW='+f.contentWindow.innerWidth;
    }catch(e){document.title='ERR '+e.message;}
  },1600);});
</script>
</body></html>
